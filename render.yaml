services:
  - type: web
    name: mern-ecommerce-softcart
    env: node
    plan: free
    branch: softcart-tech
    buildCommand: npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        sync: false
